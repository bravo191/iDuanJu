name: build iOS IPA (branch only, no release)

# iOS-only 未签名 IPA 构建，两种触发方式：
#   1. 推一个 ios-* 轻量 tag（如 ios-b27）→ 自动构建该 tag 指向的代码（推荐，无需改动 main）；
#   2. Actions 页 workflow_dispatch（GitHub 要求该 workflow 存在于默认分支，当前不满足，
#      仅当未来把它合入 main 后才可用）。
# 不构建 Android、不发布 Release，IPA 在运行记录的 Artifacts（ios-unsigned）下载。
on:
  push:
    tags:
      - 'ios-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            DerivedDataRelease/SourcePackages
          key: ${{ runner.os }}-swift-packages-${{ hashFiles('project.yml', 'Packages/**/Package.swift') }}
          restore-keys: ${{ runner.os }}-swift-packages-
      - name: Build unsigned IPA
        env:
          STV_RUN_TESTS: '0'
          STV_BUILD_SIMULATOR: '0'
        run: scripts/package.sh "$RUNNER_TEMP/dist"
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: ${{ runner.temp }}/dist/logs/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: ${{ runner.temp }}/dist/*.ipa
          if-no-files-found: error
